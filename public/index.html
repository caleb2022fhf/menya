<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <title>Menya AI - Video Call Mwarimu</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #avatar-container { width: 320px; height: 320px; border-radius: 50%; overflow: hidden; border: 4px solid #3b82f6; margin-bottom: 20px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .chat-box { width: 400px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 8px; border: none; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Aha niho mwarimu wa video azaba ari -->
    <div id="avatar-container">
        <video id="teacherVideo" autoplay muted loop src="default-idle.mp4"></video>
    </div>

    <div class="chat-box">
        <input type="text" id="userInput" placeholder="Baza Menya AI...">
        <button onclick="sendMessage()">Ohereza</button>
    </div>

    <script>
        async function sendMessage() {
            const message = document.getElementById('userInput').value;
            if (!message) return;

            // 1. Tuvugana na Backend ya Menya AI
            const res = await fetch('/api/ai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await res.json();
            
            console.log("Igisubizo cya AI:", data.reply);
            
            // 2. Aha ni ho wohereza igisubizo cya AI kuri D-ID/HeyGen API kugira ngo ikore video y'umwarimu avuga
            // playTeacherVideo(data.reply);
        }
    </script>
</body>
</html>
