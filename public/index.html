<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menya AI Hub - Login / Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-gray-100 font-sans flex items-center justify-center min-h-screen">
  <div id="index-root"></div>

  <script type="text/babel">
    const { useState } = React;

    function IndexAuthApp() {
      const [isSignup, setIsSignup] = useState(false);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [profilePic, setProfilePic] = useState('');

      // Gusoma ifoto y'umunyeshuri igihe ari kwiyandikisha
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setProfilePic(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!username.trim()) return;

        // Kubika izina na Avatar muri localStorage
        localStorage.setItem('menya_current_user', username);
        if (profilePic) {
          localStorage.setItem(`menya_avatar_${username}`, profilePic);
        }

        alert(isSignup ? "Konti yafunguwe neza! Urinjira..." : "Mwinjiye neza!");
        window.location.href = 'home.html';
      };

      return (
        <div className="bg-neutral-900 border border-neutral-800 p-8 rounded-2xl max-w-md w-full space-y-6 shadow-2xl">
          <div className="text-center space-y-2">
            <div className="w-12 h-12 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold mx-auto text-lg">
              M
            </div>
            <h1 className="text-xl font-bold text-white">MENYA AI HUB</h1>
            <p className="text-xs text-neutral-400">
              {isSignup ? 'Fungura konti nshya yo kwiga' : 'Injira muri konte yawe kugira ngo ukomeze wige'}
            </p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-xs text-neutral-400 mb-1">Izina cyangwa Imeyili (Username)</label>
              <input
                type="text"
                required
                value={username}
                onChange={(e) => setUsername(e.target.value)}
                placeholder="Andika izina ryawe..."
                className="w-full bg-black border border-neutral-800 p-3 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500"
              />
            </div>

            <div>
              <label className="block text-xs text-neutral-400 mb-1">Ijambo ry'Ibanga (Password)</label>
              <input
                type="password"
                required
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="••••••••"
                className="w-full bg-black border border-neutral-800 p-3 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500"
              />
            </div>

            {isSignup && (
              <div>
                <label className="block text-xs text-neutral-400 mb-1">Ifoto y'Umwirondoro (Profile Picture)</label>
                <input
                  type="file"
                  accept="image/*"
                  onChange={handleImageUpload}
                  className="w-full bg-black border border-neutral-800 p-2 rounded-xl text-xs text-neutral-400 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-emerald-600 file:text-white hover:file:bg-emerald-500"
                />
              </div>
            )}

            <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl text-xs font-bold transition-all">
              {isSignup ? 'Emeza konti (Sign Up)' : 'Injira (Login)'}
            </button>
          </form>

          <div className="text-center text-xs text-neutral-400">
            {isSignup ? (
              <p>Ufite konti? <button onClick={() => setIsSignup(false)} className="text-emerald-400 font-bold hover:underline">Injira hano</button></p>
            ) : (
              <p>Uri mushya hano? <button onClick={() => setIsSignup(true)} className="text-emerald-400 font-bold hover:underline">Fungura Konti</button></p>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('index-root')).render(<IndexAuthApp />);
  </script>
</body>
</html>
