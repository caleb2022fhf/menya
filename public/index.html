<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menya AI Hub - Rwanda</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-black text-gray-100 font-sans selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function MenyaApp() {
      const [activeTab, setActiveTab] = useState('courses');
      const [courses, setCourses] = useState([
        {
          id: 1,
          title: "Rwandan Traffic Regulations (Amategeko y'Omuhanda)",
          category: "Driving Laws",
          embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", // Replace with actual YouTube embed link
          description: "Official guide covering road signs, priority rules, and city speed limits.",
          scheduleTime: "Monday & Wednesday, 09:00 AM"
        },
        {
          id: 2,
          title: "Off-Grid Solar PV Wiring & TVET Installation",
          category: "TVET Technical",
          embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
          description: "Practical steps for inverter sizing, battery wiring, and earth grounding.",
          scheduleTime: "Tuesday & Thursday, 02:00 PM"
        }
      ]);
      const [selectedCourse, setSelectedCourse] = useState(courses[0]);

      // Admin Modal & Security States
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState(false);

      // New Course Form State
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('Driving Laws');
      const [newYoutubeUrl, setNewYoutubeUrl] = useState('');
      const [newSchedule, setNewSchedule] = useState('');
      const [newDesc, setNewDesc] = useState('');

      // AI Chat States
      const [chatInput, setChatInput] = useState('');
      const [isAiThinking, setIsAiThinking] = useState(false);
      const [messages, setMessages] = useState([
        { role: 'assistant', text: "Muraho! I am Menya AI. Ask me anything about Rwandan driving rules or TVET courses." }
      ]);

      // Listen for Ctrl + Shift + T shortcut
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 't') {
            e.preventDefault();
            setShowAdminModal(true);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Handle Admin Password Verification
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (passwordInput === 'Caleb@2026') {
          setIsAdminLoggedIn(true);
          setAuthError(false);
          setPasswordInput('');
        } else {
          setAuthError(true);
        }
      };

      // Helper to convert regular YouTube links into embed links
      const convertToEmbed = (url) => {
        if (!url) return '';
        if (url.includes('embed/')) return url;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11)
          ? `https://www.youtube.com/embed/${match[2]}`
          : url;
      };

      // Handle adding new video course
      const handleAddCourse = (e) => {
        e.preventDefault();
        const formattedUrl = convertToEmbed(newYoutubeUrl);
        const newCourseObj = {
          id: courses.length + 1,
          title: newTitle,
          category: newCategory,
          embedUrl: formattedUrl,
          description: newDesc,
          scheduleTime: newSchedule || "Self-Paced"
        };
        setCourses([...courses, newCourseObj]);
        setSelectedCourse(newCourseObj);
        alert("Course video and schedule successfully added!");
        setNewTitle('');
        setNewYoutubeUrl('');
        setNewDesc('');
        setNewSchedule('');
        setShowAdminModal(false);
      };

      // AI Question handler
      const handleSendQuestion = async (e) => {
        e.preventDefault();
        if (!chatInput.trim() || isAiThinking) return;

        const userText = chatInput;
        setChatInput('');
        setMessages(prev => [...prev, { role: 'user', text: userText }]);
        setIsAiThinking(true);

        try {
          const res = await fetch('/api/ask-menya', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: userText })
          });
          const data = await res.json();
          setMessages(prev => [...prev, { role: 'assistant', text: data.answer }]);
        } catch (err) {
          setMessages(prev => [...prev, { role: 'assistant', text: "Error connecting to AI server." }]);
        } finally {
          setIsAiThinking(false);
        }
      };

      return (
        <div className="min-h-screen bg-black text-white font-sans flex flex-col">
          {/* Header Bar */}
          <header className="border-b border-neutral-800 bg-neutral-950 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold">
                M
              </div>
              <h1 className="text-base font-bold tracking-tight text-white">
                MENYA <span className="text-emerald-400 text-xs font-mono">AI HUB (RWANDA)</span>
              </h1>
            </div>

            {/* Navigation Tabs */}
            <div className="flex items-center gap-2 bg-neutral-900 border border-neutral-800 p-1 rounded-xl">
              <button
                onClick={() => setActiveTab('courses')}
                className={`px-4 py-1.5 rounded-lg text-xs font-medium transition-all ${activeTab === 'courses' ? 'bg-neutral-800 text-white' : 'text-neutral-400 hover:text-white'}`}
              >
                🎥 Video Academy
              </button>
              <button
                onClick={() => setActiveTab('timetable')}
                className={`px-4 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 ${activeTab === 'timetable' ? 'bg-neutral-800 text-white' : 'text-neutral-400 hover:text-white'}`}
              >
                📅 Timetable & Schedule
              </button>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-[1600px] w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Column (Courses or Timetable) */}
            <div className="lg:col-span-8 space-y-6">
              {activeTab === 'courses' ? (
                <>
                  {/* YouTube Video Player Embed */}
                  <div className="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-2xl">
                    <div className="relative aspect-video bg-black">
                      <iframe
                        src={selectedCourse.embedUrl}
                        title={selectedCourse.title}
                        className="w-full h-full border-0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowFullScreen
                      ></iframe>
                    </div>

                    <div className="p-5 border-t border-neutral-800 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-xs text-emerald-400 font-mono px-2.5 py-1 rounded bg-emerald-500/10 border border-emerald-500/20">
                            {selectedCourse.category}
                          </span>
                          <h2 className="text-lg font-bold text-white mt-2">{selectedCourse.title}</h2>
                        </div>
                        <div className="text-right text-xs text-neutral-400 bg-neutral-950 px-3 py-1.5 rounded-lg border border-neutral-800">
                          🕒 {selectedCourse.scheduleTime}
                        </div>
                      </div>
                      <p className="text-sm text-neutral-400">{selectedCourse.description}</p>
                    </div>
                  </div>

                  {/* Course Selector Grid */}
                  <div className="space-y-3">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-neutral-400">Available Learning Modules</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {courses.map((c) => (
                        <div
                          key={c.id}
                          onClick={() => setSelectedCourse(c)}
                          className={`p-4 rounded-xl border cursor-pointer transition-all ${selectedCourse.id === c.id ? 'bg-neutral-900 border-emerald-500/50 shadow-md' : 'bg-neutral-950 border-neutral-800 hover:border-neutral-700'}`}
                        >
                          <span className="text-[10px] text-emerald-400 font-mono">{c.category}</span>
                          <h4 className="text-sm font-bold text-white line-clamp-1 mt-1">{c.title}</h4>
                          <p className="text-xs text-neutral-400 mt-2">Schedule: {c.scheduleTime}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              ) : (
                /* Timetable / Schedule View */
                <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 space-y-6">
                  <div>
                    <h2 className="text-lg font-bold text-white">Student Study Timetable</h2>
                    <p className="text-xs text-neutral-400">Scheduled session times set by administrators for structured TVET & driving lessons.</p>
                  </div>

                  <div className="space-y-3">
                    {courses.map((c) => (
                      <div key={c.id} className="bg-neutral-950 border border-neutral-800 p-4 rounded-xl flex items-center justify-between">
                        <div>
                          <span className="text-xs text-emerald-400 font-mono">{c.category}</span>
                          <h4 className="text-sm font-bold text-white mt-0.5">{c.title}</h4>
                        </div>
                        <div className="flex items-center gap-2 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-lg text-xs font-mono text-emerald-300">
                          📅 {c.scheduleTime}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* Right Column: Menya AI Chat Assistant */}
            <div className="lg:col-span-4 flex flex-col h-[700px] bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-2xl">
              <div className="p-4 border-b border-neutral-800 bg-neutral-950 flex items-center justify-between">
                <span className="text-sm font-bold text-white flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  Menya Assistant
                </span>
                <span className="text-[10px] text-neutral-400 font-mono bg-neutral-900 px-2 py-0.5 rounded border border-neutral-800">
                  RAG Active
                </span>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-xs leading-relaxed ${m.role === 'user' ? 'bg-emerald-600 text-white font-medium' : 'bg-neutral-950 border border-neutral-800 text-neutral-200'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
                {isAiThinking && (
                  <div className="text-xs text-neutral-500 animate-pulse font-mono">Searching official PDFs...</div>
                )}
              </div>

              <form onSubmit={handleSendQuestion} className="p-3 border-t border-neutral-800 bg-neutral-950 flex gap-2">
                <input
                  type="text"
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  placeholder="Ask a question about your lessons..."
                  className="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                />
                <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs font-medium">
                  Send
                </button>
              </form>
            </div>

          </main>

          {/* Admin Dashboard Modal (Triggered by Ctrl + Shift + T) */}
          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl max-w-lg w-full p-6 space-y-6 relative shadow-2xl">
                <button 
                  onClick={() => { setShowAdminModal(false); setIsAdminLoggedIn(false); setAuthError(false); }}
                  className="absolute top-4 right-4 text-neutral-400 hover:text-white text-sm font-bold"
                >
                  ✕
                </button>

                {!isAdminLoggedIn ? (
                  /* Password Verification Step */
                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <div>
                      <h3 className="text-base font-bold text-white">Administrator Login</h3>
                      <p className="text-xs text-neutral-400">Enter your secure password to access video uploading.</p>
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Password</label>
                      <input
                        type="password"
                        value={passwordInput}
                        onChange={(e) => setPasswordInput(e.target.value)}
                        placeholder="Enter admin password..."
                        className="w-full bg-black border border-neutral-800 p-3 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500"
                        autoFocus
                      />
                      {authError && <p className="text-xs text-red-500 mt-1">Incorrect password. Access denied.</p>}
                    </div>

                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl text-xs font-bold">
                      Verify & Open Dashboard
                    </button>
                  </form>
                ) : (
                  /* Video & Timetable Upload Form */
                  <form onSubmit={handleAddCourse} className="space-y-4">
                    <div>
                      <h3 className="text-base font-bold text-emerald-400">Admin Video & Schedule Upload</h3>
                      <p className="text-xs text-neutral-400">Add YouTube lesson link and timetable slot.</p>
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Course Title</label>
                      <input
                        type="text"
                        required
                        value={newTitle}
                        onChange={(e) => setNewTitle(e.target.value)}
                        placeholder="e.g. Advanced Road Signs"
                        className="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-xs text-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Category</label>
                      <select
                        value={newCategory}
                        onChange={(e) => setNewCategory(e.target.value)}
                        className="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-xs text-white"
                      >
                        <option value="Driving Laws">Driving Laws</option>
                        <option value="TVET Technical">TVET Technical</option>
                        <option value="Agriculture">Agriculture</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">YouTube Video Link / Embed URL</label>
                      <input
                        type="text"
                        required
                        value={newYoutubeUrl}
                        onChange={(e) => setNewYoutubeUrl(e.target.value)}
                        placeholder="https://www.youtube.com/watch?v=..."
                        className="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-xs text-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Timetable Schedule (e.g., Friday, 10:00 AM)</label>
                      <input
                        type="text"
                        value={newSchedule}
                        onChange={(e) => setNewSchedule(e.target.value)}
                        placeholder="Friday, 10:00 AM"
                        className="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-xs text-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Description</label>
                      <textarea
                        value={newDesc}
                        onChange={(e) => setNewDesc(e.target.value)}
                        placeholder="Brief lesson description..."
                        className="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-xs text-white h-16"
                      />
                    </div>

                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl text-xs font-bold">
                      Publish to Student Platform
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MenyaApp />);
  </script>
</body>
</html>
