<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menya AI Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-black text-gray-100 font-sans">
  <div id="root"></div>

  <!-- Component Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function MenyaApp() {
      const [activeTab, setActiveTab] = useState('courses');
      const [searchQuery, setSearchQuery] = useState('');
      const [chatInput, setChatInput] = useState('');
      const [isAiThinking, setIsAiThinking] = useState(false);
      const videoRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);

      const [messages, setMessages] = useState([
        { role: 'assistant', text: "Muraho! Ask me about Rwandan driving laws, TVET solar wiring, or crop rotation." }
      ]);

      const handleSendQuestion = async (e) => {
        e.preventDefault();
        if (!chatInput.trim() || isAiThinking) return;

        const userText = chatInput;
        setChatInput('');
        setMessages(prev => [...prev, { role: 'user', text: userText }]);
        setIsAiThinking(true);

        try {
          const res = await fetch('/api/ask-menya', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: userText })
          });
          const data = await res.json();
          setMessages(prev => [...prev, { role: 'assistant', text: data.answer }]);
        } catch (err) {
          setMessages(prev => [...prev, { role: 'assistant', text: "Error connecting to server API." }]);
        } finally {
          setIsAiThinking(false);
        }
      };

      return (
        <div className="min-h-screen bg-black text-white p-6">
          <header className="border-b border-neutral-800 pb-4 mb-6 flex justify-between items-center">
            <h1 className="text-xl font-bold text-emerald-400">MENYA AI HUB</h1>
            <span className="text-xs text-neutral-400 bg-neutral-900 px-3 py-1 rounded-full border border-neutral-800">
              Rwanda TVET & Traffic Code
            </span>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Main Video & Content Area */}
            <div className="lg:col-span-8 bg-neutral-900 border border-neutral-800 rounded-2xl p-6">
              <h2 className="text-lg font-bold mb-4">TVET Solar & Driving Regulations Player</h2>
              <div className="aspect-video bg-black rounded-xl overflow-hidden flex items-center justify-center border border-neutral-800">
                <video
                  ref={videoRef}
                  src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                  controls
                  className="w-full h-full object-contain"
                />
              </div>
            </div>

            {/* AI Assistant Chat Sidebar */}
            <div className="lg:col-span-4 bg-neutral-900 border border-neutral-800 rounded-2xl flex flex-col h-[600px]">
              <div className="p-4 border-b border-neutral-800 font-bold text-emerald-400">
                Menya Assistant
              </div>
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {messages.map((m, i) => (
                  <div key={i} className={`p-3 rounded-xl text-xs ${m.role === 'user' ? 'bg-emerald-600 text-white ml-auto max-w-[80%]' : 'bg-neutral-950 text-neutral-200 border border-neutral-800 max-w-[90%]'}`}>
                    {m.text}
                  </div>
                ))}
                {isAiThinking && (
                  <div className="text-xs text-neutral-500 animate-pulse">Searching documents...</div>
                )}
              </div>
              <form onSubmit={handleSendQuestion} className="p-3 border-t border-neutral-800 flex gap-2">
                <input
                  type="text"
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  placeholder="Ask a question..."
                  className="flex-1 bg-black border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                />
                <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">
                  Send
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MenyaApp />);
  </script>
</body>
</html>
