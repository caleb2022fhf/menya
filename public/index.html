
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MENYA AI HUB | Login</title>

    <meta name="description" content="MENYA AI HUB - Learn Agriculture and Driving Laws">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #171717;
            border: 1px solid #303030;
            border-radius: 17px;
            padding: 30px 32px;
            text-align: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            border: 1px solid #008f68;
            background: #10382d;
            color: #00d69a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
            margin: 0 auto 13px;
        }

        h1 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            height: 43px;
            padding: 0 13px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #050505;
            color: white;
            outline: none;
            font-size: 12px;
        }

        input:focus, select:focus {
            border-color: #00c98c;
        }

        input::placeholder {
            color: #aaa;
        }

        input[type="file"] {
            padding: 7px;
            color: #aaa;
            height: auto;
            min-height: 43px;
        }

        input[type="file"]::file-selector-button {
            background: #009c70;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 7px 12px;
            margin-right: 10px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            height: 43px;
            border: none;
            border-radius: 12px;
            background: #009d70;
            color: white;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: .3s;
        }

        .submit-btn:hover {
            background: #00b986;
        }

        .submit-btn:disabled {
            opacity: .6;
            cursor: wait;
        }

        .switch {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }

        .switch a {
            color: #00d69a;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .switch a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        #preview {
            display: none;
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 50%;
            margin: 12px auto;
            border: 2px solid #00c98c;
        }

        .message {
            color: #00d69a;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message.error {
            color: #ff6464;
        }

        .message-box {
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #493030;
            background: #211313;
            border-radius: 9px;
            color: #ff7777;
            font-size: 11px;
            text-align: left;
            line-height: 1.6;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .debug-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        @media(max-width: 400px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">M</div>

    <!-- LOGIN SECTION -->

    <section id="loginSection">

        <h1>MENYA AI HUB</h1>

        <p class="subtitle">
            Injira muri konte yawe yo kwiga
        </p>

        <form class="form" id="loginForm">

            <div class="form-group">

                <label>Izina ry'Umukoresha (Username / Email)</label>

                <input
                    type="text"
                    name="identity"
                    placeholder="Andika izina ryawe..."
                    autocomplete="username"
                    required>

            </div>

            <div class="form-group">

                <label>Ijambo ry'ibanga (Password)</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Andika ijambo ry'ibanga..."
                    autocomplete="current-password"
                    required>

            </div>

            <button
                type="submit"
                class="submit-btn"
                id="loginButton">

                Injira (Login)

            </button>

        </form>

        <p class="switch">
            Uri umunyeshuri mushya?
            <a href="#" id="openRegister">Fungura Konti</a>
        </p>

    </section>


    <!-- REGISTRATION SECTION -->

    <section id="registerSection" class="hidden">

        <h1>MENYA AI HUB</h1>

        <p class="subtitle">
            Fungura konti nshya y'umunyeshuri
        </p>

        <form class="form" id="registerForm">

            <div class="form-group">

                <label>Izina ry'Umukoresha (Username)</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Andika izina ryawe..."
                    minlength="3"
                    maxlength="40"
                    autocomplete="username"
                    required>

            </div>

            <div class="form-group">

                <label>Imeyili (Email Address)</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Andika email yawe..."
                    maxlength="254"
                    autocomplete="email"
                    required>

            </div>

            <div class="form-group">

                <label>Ijambo ry'ibanga (Password)</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Hitamo ijambo ry'ibanga..."
                    minlength="8"
                    autocomplete="new-password"
                    required>

            </div>

            <div class="form-group">

                <label>Hitamo Ishami ry'Isomo (Trade / Category)</label>

                <select name="category" required>

                    <option value="">Hitamo ishami...</option>

                    <option value="Agriculture">
                        Ubuhinzi (Agriculture)
                    </option>

                    <option value="Driving Laws">
                        Amategeko yo mu Muhanda (Driving Laws)
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Foto y'Umwirondoro (Profile Picture)</label>

                <input
                    type="file"
                    id="profilePicture"
                    name="profilePicture"
                    accept="image/jpeg,image/png,image/webp"
                    required>

                <img id="preview" alt="Profile picture preview">

            </div>

            <button
                type="submit"
                class="submit-btn"
                id="registerButton">

                Emeza Kwiyandikisha (Sign Up)

            </button>

        </form>

        <p class="switch">
            Ufite konti?
            <a href="#" id="openLogin">Injira hano</a>
        </p>

    </section>


    <!-- ERROR AND SUCCESS MESSAGES -->

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <div id="debugBox" class="message-box hidden">

        <div class="debug-title">MENYA BACKEND DEBUG INFORMATION</div>

        <div id="debugContent"></div>

    </div>

</div>


<script>

    // PAGE ELEMENTS

    const loginSection = document.getElementById("loginSection");
    const registerSection = document.getElementById("registerSection");

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const message = document.getElementById("message");

    const debugBox = document.getElementById("debugBox");
    const debugContent = document.getElementById("debugContent");

    const loginButton = document.getElementById("loginButton");
    const registerButton = document.getElementById("registerButton");

    const profilePicture = document.getElementById("profilePicture");
    const preview = document.getElementById("preview");


    // DISPLAY SUCCESS OR ERROR MESSAGE

    function showMessage(text, error = false) {

        message.textContent = text;
        message.classList.toggle("error", error);

    }


    // DISPLAY BACKEND DEBUG INFORMATION

    function showDebug(title, details) {

        debugBox.classList.remove("hidden");

        debugContent.textContent =
            title + "\n\n" + details;

    }


    function clearMessages() {

        message.textContent = "";
        message.classList.remove("error");

        debugBox.classList.add("hidden");
        debugContent.textContent = "";

    }


    // CHANGE LOGIN AND REGISTER PAGES

    function showLogin() {

        registerSection.classList.add("hidden");
        loginSection.classList.remove("hidden");

        clearMessages();

    }


    function showRegister() {

        loginSection.classList.add("hidden");
        registerSection.classList.remove("hidden");

        clearMessages();

    }


    document.getElementById("openRegister").addEventListener("click", function(event) {

        event.preventDefault();
        showRegister();

    });


    document.getElementById("openLogin").addEventListener("click", function(event) {

        event.preventDefault();
        showLogin();

    });


    // READ BACKEND RESPONSE SAFELY

    async function readResponse(response) {

        const text = await response.text();

        let result;

        try {

            result = JSON.parse(text);

        } catch (error) {

            throw new Error(
                "SERVER DID NOT RETURN JSON.\n" +
                "HTTP STATUS: " + response.status + "\n" +
                "SERVER RESPONSE: " + text.substring(0, 1000)
            );

        }

        if (!response.ok || !result.success) {

            const error = new Error(
                result.message || "Request failed."
            );

            error.status = response.status;
            error.details = result.error || "No additional error details.";
            error.code = result.errorCode || "";

            throw error;

        }

        return result;

    }


    // PROFILE PICTURE PREVIEW

    profilePicture.addEventListener("change", function() {

        const file = this.files[0];

        if (!file) {

            preview.style.display = "none";
            return;

        }

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        if (!allowedTypes.includes(file.type)) {

            this.value = "";
            preview.style.display = "none";

            showMessage("Hitamo ifoto ya JPG, PNG cyangwa WEBP.", true);

            return;

        }

        if (file.size > 1.5 * 1024 * 1024) {

            this.value = "";
            preview.style.display = "none";

            showMessage("Ifoto igomba kuba munsi ya 1.5MB.", true);

            return;

        }

        const imageURL = URL.createObjectURL(file);

        preview.onload = function() {
            URL.revokeObjectURL(imageURL);
        };

        preview.src = imageURL;
        preview.style.display = "block";

        clearMessages();

    });


    // =====================================
    // LOGIN SYSTEM
    // =====================================

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        clearMessages();

        const identity = this.elements.identity.value.trim();
        const password = this.elements.password.value;

        if (!identity || !password) {

            showMessage("Uzuza amakuru yose.", true);
            return;

        }

        loginButton.disabled = true;
        loginButton.textContent = "Turimo kugenzura...";

        showMessage("Turimo kugenzura amakuru yawe...");

        try {

            const response = await fetch("/api/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "same-origin",

                body: JSON.stringify({
                    identity: identity,
                    password: password
                })

            });

            const result = await readResponse(response);

            // ADMIN LOGIN

            if (result.role === "admin") {

                showMessage("Murakaza neza Admin!");

                window.location.replace("/control-room.html");

                return;

            }

            // STUDENT LOGIN

            if (result.role === "student") {

                showMessage("Murakaza neza!");

                window.location.replace("/home.html");

                return;

            }

            throw new Error("Unknown user role: " + result.role);

        } catch (error) {

            console.error("MENYA LOGIN ERROR:", error);

            showMessage(
                "Login failed. Reba amakuru y'ikibazo hasi.",
                true
            );

            const details = [
                "Message: " + error.message,
                "HTTP Status: " + (error.status || "Unknown"),
                "Error Details: " + (error.details || "Not available"),
                "Error Code: " + (error.code || "Not available"),
                "Time: " + new Date().toISOString()
            ].join("\n");

            showDebug("LOGIN ERROR DETAILS", details);

        } finally {

            loginButton.disabled = false;
            loginButton.textContent = "Injira (Login)";

        }

    });


    // =====================================
    // REGISTRATION SYSTEM
    // =====================================

    registerForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        clearMessages();

        const file = profilePicture.files[0];

        if (!file) {

            showMessage("Hitamo ifoto yawe.", true);
            return;

        }

        if (file.size > 1.5 * 1024 * 1024) {

            showMessage("Ifoto igomba kuba munsi ya 1.5MB.", true);
            return;

        }

        registerButton.disabled = true;
        registerButton.textContent = "Turimo kwandikisha...";

        showMessage("Turimo kwandikisha konti yawe...");

        try {

            // CONVERT IMAGE TO BASE64

            const profileImage = await new Promise((resolve, reject) => {

                const reader = new FileReader();

                reader.onload = function() {
                    resolve(reader.result);
                };

                reader.onerror = function() {
                    reject(new Error("Ntibyashobotse gusoma ifoto."));
                };

                reader.readAsDataURL(file);

            });


            // SEND DATA TO BACKEND

            const response = await fetch("/api/register", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "same-origin",

                body: JSON.stringify({

                    username: this.elements.username.value.trim(),

                    email: this.elements.email.value.trim(),

                    password: this.elements.password.value,

                    category: this.elements.category.value,

                    profileImage: profileImage

                })

            });


            const result = await readResponse(response);


            // REGISTRATION SUCCESS

            if (result.success) {

                showMessage("Konti yawe yafunguwe neza!");

                window.location.replace("/home.html");

            }

        } catch (error) {

            console.error("MENYA REGISTRATION ERROR:", error);

            showMessage(
                "Registration failed. Reba amakuru y'ikibazo hasi.",
                true
            );

            const details = [
                "Message: " + error.message,
                "HTTP Status: " + (error.status || "Unknown"),
                "Error Details: " + (error.details || "Not available"),
                "Error Code: " + (error.code || "Not available"),
                "Time: " + new Date().toISOString()
            ].join("\n");

            showDebug("REGISTRATION ERROR DETAILS", details);

        } finally {

            registerButton.disabled = false;

            registerButton.textContent =
                "Emeza Kwiyandikisha (Sign Up)";

        }

    });

</script>

</body>
</html>
