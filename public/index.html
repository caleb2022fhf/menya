
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENYA AI HUB | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #171717;
            border: 1px solid #303030;
            border-radius: 17px;
            padding: 30px 32px;
            text-align: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            border: 1px solid #008f68;
            background: #10382d;
            color: #00d69a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
            margin: 0 auto 13px;
        }

        h1 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            height: 43px;
            padding: 0 13px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #050505;
            color: white;
            outline: none;
            font-size: 12px;
        }

        input:focus, select:focus {
            border-color: #00c98c;
        }

        input::placeholder {
            color: #aaa;
        }

        input[type="file"] {
            padding: 7px;
            color: #aaa;
            height: auto;
            min-height: 43px;
        }

        input[type="file"]::file-selector-button {
            background: #009c70;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 7px 12px;
            margin-right: 10px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            height: 43px;
            border: none;
            border-radius: 12px;
            background: #009d70;
            color: white;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: .3s;
        }

        .submit-btn:hover {
            background: #00b986;
        }

        .switch {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }

        .switch a {
            color: #00d69a;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .switch a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        #preview {
            display: none;
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 50%;
            margin: 12px auto;
            border: 2px solid #00c98c;
        }

        .message {
            color: #00d69a;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }

        @media(max-width: 400px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">M</div>

    <!-- LOGIN FORM -->

    <div id="loginSection">

        <h1>MENYA AI HUB</h1>
        <p class="subtitle">Injira muri konte yawe yo kwiga</p>

        <form class="form" id="loginForm">

            <div class="form-group">
                <label>Izina ry'Umukoresha (Username)</label>
                <input
                    type="text"
                    name="identity"
                    placeholder="Andika izina ryawe..."
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label>Ijambo ry'ibanga (Password)</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Ijambo ry'ibanga..."
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="submit-btn">
                Injira (Login)
            </button>

        </form>

        <p class="switch">
            Uri umunyeshuri mushya?
            <a onclick="showRegister()">Fungura Konti</a>
        </p>

    </div>


    <!-- REGISTRATION FORM -->

    <div id="registerSection" class="hidden">

        <h1>MENYA AI HUB</h1>
        <p class="subtitle">Fungura konti nshya y'umunyeshuri</p>

        <form class="form" id="registerForm">

            <div class="form-group">
                <label>Izina ry'Umukoresha (Username)</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Andika izina ryawe..."
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label>Imeyili (Email Address)</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Andika email yawe..."
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label>Ijambo ry'ibanga (Password)</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Hitamo ijambo ry'ibanga..."
                    autocomplete="new-password"
                    minlength="8"
                    required>
            </div>

            <div class="form-group">
                <label>Hitamo Ishami ry'Isomo (Trade / Category)</label>
                <select name="category" required>
                    <option value="">Hitamo ishami...</option>
                    <option value="Agriculture">Ubuhinzi (Agriculture)</option>
                    <option value="Driving Laws">Amategeko yo mu Muhanda (Driving Laws)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Foto y'Umwirondoro (Profile Picture)</label>
                <input
                    type="file"
                    id="profilePicture"
                    name="profilePicture"
                    accept="image/*"
                    required>

                <img id="preview" alt="Profile preview">
            </div>

            <button type="submit" class="submit-btn">
                Emeza Kwiyandikisha (Sign Up)
            </button>

        </form>

        <p class="switch">
            Ufite konti?
            <a onclick="showLogin()">Injira hano</a>
        </p>

    </div>

    <p id="message" class="message"></p>

</div>

<script>
    const loginSection = document.getElementById("loginSection");
    const registerSection = document.getElementById("registerSection");
    const message = document.getElementById("message");

    function showRegister() {
        loginSection.classList.add("hidden");
        registerSection.classList.remove("hidden");
        message.textContent = "";
    }

    function showLogin() {
        registerSection.classList.add("hidden");
        loginSection.classList.remove("hidden");
        message.textContent = "";
    }

    const profilePicture = document.getElementById("profilePicture");
    const preview = document.getElementById("preview");

    profilePicture.addEventListener("change", function() {
        const file = this.files[0];

        if (!file) {
            preview.style.display = "none";
            return;
        }

        if (!file.type.startsWith("image/")) {
            this.value = "";
            preview.style.display = "none";
            message.textContent = "Hitamo ifoto gusa.";
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            this.value = "";
            preview.style.display = "none";
            message.textContent = "Ifoto igomba kuba munsi ya 5MB.";
            return;
        }

        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        message.textContent = "";
    });

    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        message.textContent = "Login API ntirahuza. Tuzayihuza na database.";
    });

    document.getElementById("registerForm").addEventListener("submit", function(event) {
        event.preventDefault();
        message.textContent = "Registration API ntirahuza. Tuzayihuza na database.";
    });
</script>

</body>
</html>
