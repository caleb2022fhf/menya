<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menya AI Hub - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-gray-100 font-sans selection:bg-emerald-500 selection:text-black">
  <div id="home-root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function HomeApp() {
      const currentUser = localStorage.getItem('menya_current_user') || 'Umunyeshuri';
      const studentCategory = localStorage.getItem(`menya_student_category_${currentUser}`) || 'Driving Laws';
      const studentIdNum = localStorage.getItem(`menya_student_id_${currentUser}`) || 'TVET-2026';
      
      const [userAvatar, setUserAvatar] = useState('');
      const [todayCourse, setTodayCourse] = useState(null);

      // Amasomo y'ibanze y'icyitegererezo
      const defaultCourses = [
        {
          id: 1,
          title: "Isomo rya 1: Amategeko y'Omuhanda & Ibimenyetso",
          category: "Driving Laws",
          trade: "Driving Laws",
          dayName: "Isomo rya mbere",
          embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
          description: "Isomo rya mbere ry'ibanze ry'amategeko y'umuhanda.",
          quiz: [
            { q: "Ni uwuhe muvuduku wemewe mu Mujyi wa Kigali?", options: ["40 km/h", "80 km/h", "100 km/h"], answer: 0 }
          ]
        },
        {
          id: 2,
          title: "Isomo rya 1: Off-Grid Solar PV Wiring & TVET",
          category: "TVET Technical",
          trade: "TVET Technical",
          dayName: "Isomo rya mbere",
          embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
          description: "Isomo rya mbere ry'ibanze rya TVET Solar Installation.",
          quiz: [
            { q: "Ni uwuhe mugozi ukoreshwa kuri 12V 1000W inverter?", options: ["4 AWG", "12 AWG", "20 AWG"], answer: 0 }
          ]
        },
        {
          id: 3,
          title: "Isomo rya 1: Ubuhinzi n'Ubworozi bwa Kijyambere",
          category: "Agriculture",
          trade: "Agriculture",
          dayName: "Isomo rya mbere",
          embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
          description: "Isomo rya mbere ry'ibanze ry'ubuhinzi n'ubworozi.",
          quiz: [
            { q: "Ni ubuhe buryo bwiza bwo kuhira mu gihe cy'izuba?", options: ["Kuhira ku mirongo (Drip)", "Kwitera amazi yose", "Kureka imvura"], answer: 0 }
          ]
        }
      ];

      // Timer states
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [timeLeft, setTimeLeft] = useState(25 * 60); // 25 Min
      const [mode, setMode] = useState('study'); // 'study' cyangwa 'quiz'
      const [selectedAnswers, setSelectedAnswers] = useState({});

      // Admin Modal States (Ctrl + Shift + C)
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState(false);

      // AI Chat States
      const [chatInput, setChatInput] = useState('');
      const [isAiThinking, setIsAiThinking] = useState(false);
      const [messages, setMessages] = useState([
        { role: 'assistant', text: `Muraho ${currentUser}! Nitwa Menya AI. Wabaza ikibazo cyose kijyanye n'isomo ryawe hano.` }
      ]);

      // Shortcut Ctrl + Shift + C
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
            e.preventDefault();
            setShowAdminModal(true);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Guhitamo isomo rya mbere riri muri database ryerekeranye n'ibyo yiga
      useEffect(() => {
        const savedAvatar = localStorage.getItem(`menya_avatar_${currentUser}`);
        if (savedAvatar) {
          setUserAvatar(savedAvatar);
        } else {
          setUserAvatar(`https://ui-avatars.com/api/?name=${currentUser}&background=0D9488&color=fff`);
        }

        const adminTimetableJson = localStorage.getItem('menya_admin_timetable');
        let currentCoursesList = defaultCourses;
        
        if (adminTimetableJson) {
          try {
            const parsed = JSON.parse(adminTimetableJson);
            if (parsed.length > 0) currentCoursesList = parsed;
          } catch(e) {}
        }

        // Guhuza ishami ry'umunyeshuri (studentCategory) n'amasomo yayo, 
        // hany functors zigahitamo ISOMO RYA MBERE risanzwe muri database y'iryo shami rye gusa.
        const studentCourses = currentCoursesList.filter(c => (c.category === studentCategory || c.trade === studentCategory));
        
        let courseToStudy = studentCourses.length > 0 ? studentCourses[0] : currentCoursesList[0];
        setTodayCourse(courseToStudy);
      }, [currentUser, studentCategory]);

      // Automated Timer Logic
      useEffect(() => {
        let timer = null;
        if (isTimerRunning) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev > 1) {
                return prev - 1;
              } else {
                if (mode === 'study') {
                  alert("Iminota 25 y'isomo irangiye! Ubu twinjiye muri Quiz y'iminota 10.");
                  setMode('quiz');
                  return 10 * 60; 
                } else {
                  alert("Iminota 10 ya Quiz irangiye! System igiye gukora Auto-Submit.");
                  handleFinalSubmit();
                  return 0;
                }
              }
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [isTimerRunning, mode]);

      const handleFinalSubmit = () => {
        alert("Quiz yawe yakiriwe neza!");
        if (currentUser.toLowerCase() !== 'aimecaleb05@gmail.com') {
          localStorage.removeItem('menya_current_user');
          window.location.href = 'index.html';
        } else {
          alert("Wowe uri Admin (Aime Caleb), ntusohoka.");
          setMode('study');
          setIsTimerRunning(false);
          setTimeLeft(25 * 60);
        }
      };

      const handleStartLesson = () => {
        if (!isTimerRunning && mode === 'study') {
          setIsTimerRunning(true);
        }
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (passwordInput === 'Caleb@2026') {
          window.location.href = 'control-room.html';
        } else {
          setAuthError(true);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('menya_current_user');
        window.location.href = 'index.html';
      };

      const handleSendQuestion = async (e) => {
        e.preventDefault();
        if (!chatInput.trim() || isAiThinking) return;

        const userText = chatInput;
        setChatInput('');
        setMessages(prev => [...prev, { role: 'user', text: userText }]);
        setIsAiThinking(true);

        setTimeout(() => {
          let aiReply = "Menya AI: Isomo ryawe rya mbere rigena ko witondera amabwiriza y'ibanze.";
          if (userText.toLowerCase().includes('kigali') || userText.toLowerCase().includes('muvuduku')) {
            aiReply = "Menya AI: Umuvuduku wemewe mu Mujyi wa Kigali ni 40 km/h.";
          }
          setMessages(prev => [...prev, { role: 'assistant', text: aiReply }]);
          setIsAiThinking(false);
        }, 800);
      };

      return (
        <div className="min-h-screen bg-black text-white font-sans flex flex-col">
          <header className="border-b border-neutral-800 bg-neutral-950 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold">
                M
              </div>
              <h1 className="text-base font-bold tracking-tight text-white">
                MENYA <span className="text-emerald-400 text-xs font-mono">AI HUB (RWANDA)</span>
              </h1>
            </div>

            <div className="flex items-center gap-4">
              <div className="flex items-center gap-3 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-xl">
                <img
                  src={userAvatar}
                  alt="Profile"
                  className="w-8 h-8 rounded-full object-cover border border-emerald-500/50"
                />
                <div className="text-xs">
                  <strong className="text-emerald-400 block">{currentUser}</strong>
                  <span className="text-[10px] text-neutral-400 font-mono">ID: {studentIdNum}</span>
                </div>
              </div>

              <button onClick={handleLogout} className="text-xs text-red-400 hover:underline px-3 py-1.5 bg-red-500/10 rounded-xl border border-red-500/20">
                Sohoka
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-[1600px] w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-8 space-y-6">
              {todayCourse ? (
                <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-4 shadow-xl">
                  <div className="flex items-center justify-between bg-neutral-950 p-3 rounded-xl border border-neutral-800">
                    <div>
                      <span className="text-xs text-emerald-400 font-mono uppercase">
                        📚 Isomo rya Mbere ry'Ishami ryawe (First Lesson)
                      </span>
                      <div className="text-xl font-bold font-mono text-white">
                        {mode === 'study' ? (
                          isTimerRunning ? `📖 Kwiga (25 min): ${formatTime(timeLeft)}` : "📖 Kanda Play ku video kugira ngo timer itangire"
                        ) : (
                          `✍️ Quiz (10 min): ${formatTime(timeLeft)}`
                        )}
                      </div>
                    </div>
                    
                    {!isTimerRunning && mode === 'study' && (
                      <button 
                        onClick={handleStartLesson}
                        className="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg font-bold transition-all"
                      >
                        ▶ Tangira Kwiga
                      </button>
                    )}
                  </div>

                  {mode === 'study' ? (
                    <div 
                      onClick={handleStartLesson} 
                      className="relative aspect-video bg-neutral-900 rounded-xl overflow-hidden border border-neutral-800 flex items-center justify-center cursor-pointer"
                    >
                      {todayCourse.embedUrl ? (
                        <iframe 
                          src={todayCourse.embedUrl} 
                          className="w-full h-full border-0" 
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                          allowFullScreen
                        ></iframe>
                      ) : (
                        <div className="text-xs text-neutral-400 p-4 text-center">
                          Nta video y'isomo yashyizweho muri iri shami.
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="bg-neutral-950 p-5 rounded-xl border border-neutral-800 space-y-4">
                      <div className="flex justify-between items-center">
                        <h3 className="text-sm font-bold text-emerald-400">Quiz y'Isomo rya Mbere (Iminota 10)</h3>
                        <span className="text-xs text-neutral-400 font-mono">Auto-submit niba timer irangiye</span>
                      </div>

                      {todayCourse.quiz && todayCourse.quiz.map((qObj, idx) => (
                        <div key={idx} className="space-y-2">
                          <p className="text-xs font-medium text-white">{idx + 1}. {qObj.q}</p>
                          <div className="grid grid-cols-1 gap-2">
                            {qObj.options.map((opt, oIdx) => (
                              <button 
                                key={oIdx} 
                                onClick={() => setSelectedAnswers({...selectedAnswers, [idx]: oIdx})} 
                                className={`p-2.5 rounded-lg text-xs text-left border transition-all ${selectedAnswers[idx] === oIdx ? 'bg-emerald-600/30 border-emerald-500 text-white font-bold' : 'bg-neutral-900 border-neutral-800 text-neutral-300 hover:border-neutral-700'}`}
                              >
                                {opt}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}

                      <div className="pt-4 border-t border-neutral-800 flex justify-end">
                        <button 
                          onClick={handleFinalSubmit} 
                          className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl text-xs font-bold transition-all"
                        >
                          Emeza no Kohereza Quiz (Submit Quiz)
                        </button>
                      </div>
                    </div>
                  )}

                  <div>
                    <span className="text-[10px] text-emerald-400 font-mono px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">{todayCourse.category || todayCourse.trade}</span>
                    <h2 className="text-base font-bold text-white mt-1">{todayCourse.title}</h2>
                    <p className="text-xs text-neutral-400 mt-1">{todayCourse.description}</p>
                  </div>
                </div>
              ) : (
                <div className="p-8 text-center text-neutral-500 bg-neutral-900 border border-neutral-800 rounded-2xl">
                  Nta somo riraboneka muri iri shami. Jya muri Control Room wongereho isomo.
                </div>
              )}
            </div>

            <div className="lg:col-span-4 flex flex-col h-[700px] bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-xl">
              <div className="p-4 border-b border-neutral-800 bg-neutral-950 text-xs font-bold text-emerald-400 flex items-center justify-between">
                <span className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Menya Assistant (AI)
                </span>
                <span className="text-[10px] font-mono text-neutral-400 bg-neutral-900 px-2 py-0.5 rounded border border-neutral-800">Active</span>
              </div>
              
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {messages.map((m, i) => (
                  <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-xs leading-relaxed ${m.role === 'user' ? 'bg-emerald-600 text-white font-medium' : 'bg-neutral-950 border border-neutral-800 text-neutral-200'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
                {isAiThinking && (
                  <div className="text-xs text-emerald-400 animate-pulse font-mono flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Menya AI irimo gusubiza...
                  </div>
                )}
              </div>

              <form onSubmit={handleSendQuestion} className="p-3 border-t border-neutral-800 bg-neutral-950 flex gap-2">
                <input 
                  type="text" 
                  value={chatInput} 
                  onChange={(e) => setChatInput(e.target.value)} 
                  placeholder="Baza ikibazo cyawe hano..." 
                  className="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" 
                />
                <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold">
                  Ohereza
                </button>
              </form>
            </div>
          </main>

          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl max-w-md w-full p-6 space-y-4 relative shadow-2xl">
                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-neutral-400 hover:text-white">✕</button>
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <h3 className="text-base font-bold text-white">Admin Control Room Login</h3>
                  <p className="text-xs text-neutral-400">Injiza PIN (Caleb@2026) kugira ngo winjire muri Control Room.</p>
                  <input 
                    type="password" 
                    value={passwordInput} 
                    onChange={(e) => setPasswordInput(e.target.value)} 
                    placeholder="Injiza PIN..." 
                    className="w-full bg-black border border-neutral-800 p-3 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500" 
                    autoFocus 
                  />
                  {authError && <p className="text-xs text-red-500">PIN si yo! Ongera ugerageze.</p>}
                  <button type="submit" className="w-full bg-emerald-600 text-white p-3 rounded-xl text-xs font-bold">Fungura Control Room</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('home-root')).render(<HomeApp />);
  </script>
</body>
</html>
